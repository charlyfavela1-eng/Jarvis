[package]
name = "jarvis"
version = "1.0.0"
edition = "2021"
description = "J.A.R.V.I.S. - Just A Rather Very Intelligent System"

[dependencies]
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
base64 = "0.22"
urlencoding = "2.1"
anyhow = "1.0"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = true
